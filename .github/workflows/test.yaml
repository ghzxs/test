name: sing-box global proxy

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 安装 sing-box（.deb）
      - name: Install sing-box
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray && chmod +x xray/xray

      # 启动 sing-box（⚠️ 不用 systemctl）
      - name: Start sing-box
        run: |
          ./xray/xray run -c xray_config.json > xray.log 2>&1 &
          sleep 5
          curl ipinfo.io

      # - name: Enable proxy
      #   run: |
      #     echo "proxy_server=socks5://127.0.0.1:1080" >> $GITHUB_OUTPUT
      #     echo "use_proxy=true" >> $GITHUB_OUTPUT

      # 测试
      - name: Test proxy
        run: |
          curl ipinfo.io
          curl -x socks5://127.0.0.1:1080 ipinfo.io