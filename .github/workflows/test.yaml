name: Use WARP in Actions

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: Install WARP
        run: |
          sudo -i bash <<'EOF'
          set +e
          apt-get update
          apt-get install -y curl 
          URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest  |  jq -r '.assets[] | select(.name | test("^sing-box_.*_linux_amd64\\.deb$"))  | .browser_download_url')
          echo "URL=$URL"

          wget -O sing-box-linux-amd64.deb "$URL"

          dpkg -i sing-box-linux-amd64.deb
          apt-get install -f -y
          mv config.json /etc/sing-box/config.json
          systemctl start sing-box.service
          systemctl status  sing-box.service
          sleep 5
          EOF
          
      - name: Check IP
        run: curl ipinfo.io